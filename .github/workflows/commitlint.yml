name: Commitlint

on: [push]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pushed commit and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install commitlint
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate commit messages
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..${AFTER_SHA}"
          else
            # New branches or unavailable history after a force push: check all reachable commits.
            range="$AFTER_SHA"
          fi
          git rev-list --reverse "$range" > "$RUNNER_TEMP/commitlint-revisions"
          while IFS= read -r revision; do
            git show -s --format=%B "$revision" | npm run commitlint -- --verbose
          done < "$RUNNER_TEMP/commitlint-revisions"
